# Runnable demo — no credentials required.
# Onboards the official MCP "everything" reference server (spawned via npx) to prove the
# generic connector layer: connect → discover tools → classify read/write.
#
#   npm run forge -- connectors test --config examples/everything-demo/agent.yaml

agent:
  name: everything-demo
  mode: draft
  instructions: |
    Demo agent. Proves Forge can onboard an arbitrary MCP server from config alone,
    with no connector-specific code.

  # Needed only for `forge run` (not for `connectors test`). Requires ANTHROPIC_API_KEY.
  #   npm run forge -- run --message "what is 21 plus 21?" --config examples/everything-demo/agent.yaml
  llm:
    provider: anthropic
    model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY

connectors:
  everything:
    type: mcp
    transport:
      type: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-everything"]
    # Demonstrates human-authoritative classification overriding the heuristic:
    tool_overrides:
      echo: read
